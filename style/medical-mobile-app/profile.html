<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .app-container {
      width: 348px;
      height: 753px;
      background-color: var(--color-white);
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.15);
      user-select: none;
    }
    .absolute { position: absolute; }
    
    /* Top header dark gray background (Figma 1:1184 background) */
    .header-bg {
      left: 0;
      top: 0;
      width: 100%;
      height: 196px;
      background: linear-gradient(135deg, var(--color-bg-gray) 0%, var(--color-bg-dark) 100%);
      border-radius: 0 0 24px 24px;
      z-index: 1;
    }

    /* Status Bar */
    .status-bar {
      left: 0;
      top: 0;
      width: 100%;
      height: 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px 0 24px;
      box-sizing: border-box;
      z-index: 10;
    }
    .status-time {
      font-family: var(--font-family-lato);
      font-weight: 900;
      font-size: 13px;
      color: white;
      margin: 0;
    }
    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-icon {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      color: white;
    }
    
    /* Navigation Bar */
    .nav-bar {
      left: 21.14px;
      top: 46px;
      width: 305.78px;
      height: 36px;
      display: flex;
      align-items: center;
      z-index: 10;
    }
    .back-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      text-decoration: none;
    }
    .nav-title {
      font-family: var(--font-family-vietnam);
      font-weight: 700;
      font-size: 15px;
      color: white;
      margin: 0 0 0 12px;
    }

    /* Profile Header Details block */
    .profile-details {
      left: 21.14px;
      top: 98px;
      width: 305.78px;
      height: 70px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 10;
    }
    .avatar-sec {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid white;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
      flex-shrink: 0;
    }
    .avatar-sec img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .profile-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .profile-name {
      font-family: var(--font-family-vietnam);
      font-weight: 700;
      font-size: 16px;
      color: white;
      margin: 0 0 2px 0;
    }
    .profile-email {
      font-family: var(--font-family-lato);
      font-weight: 400;
      font-size: 10.5px;
      color: var(--color-text-gray);
      margin: 0 0 4px 0;
    }
    .profile-since {
      font-family: var(--font-family-lato);
      font-weight: 700;
      font-size: 9.5px;
      color: var(--color-primary-green);
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.25px;
    }
    .edit-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      margin-left: auto;
      cursor: pointer;
    }

    /* Scrollable Menu container */
    .menu-scroll-box {
      position: absolute;
      left: 0;
      top: 184px;
      width: 100%;
      height: 502px;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px 21.14px 80px 21.14px;
      box-sizing: border-box;
      z-index: 5;
      scrollbar-width: none;
    }
    .menu-scroll-box::-webkit-scrollbar { display: none; }

    .menu-item {
      height: 48px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #F3F2E9;
      text-decoration: none;
      color: var(--color-bg-dark);
      transition: all 0.2s ease;
    }
    .menu-item:hover {
      background-color: rgba(11, 171, 124, 0.02);
    }
    .menu-icon {
      width: 20px;
      height: 20px;
      margin-right: 14px;
      color: var(--color-text-gray);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .menu-item:hover .menu-icon {
      color: var(--color-primary-green);
    }
    .menu-text {
      font-family: var(--font-family-lato);
      font-weight: 700;
      font-size: 12.5px;
      margin: 0;
    }
    .menu-arrow {
      margin-left: auto;
      color: var(--color-text-gray);
    }

    /* Need Help Card block */
    .need-help-card {
      background-color: var(--color-secondary-purple);
      border-radius: 16px;
      padding: 16px;
      margin-top: 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0px 4px 15px rgba(95, 72, 230, 0.05);
    }
    .help-title {
      font-family: var(--font-family-lato);
      font-weight: 900;
      font-size: 12px;
      color: var(--color-bg-dark);
      margin: 0;
      text-transform: uppercase;
    }
    .help-divider {
      width: 100%;
      height: 1px;
      background-color: rgba(21, 25, 33, 0.08);
    }
    .help-link {
      font-family: var(--font-family-lato);
      font-weight: 700;
      font-size: 12px;
      color: var(--color-bg-dark);
      text-decoration: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .help-link:hover {
      color: var(--color-primary-purple);
    }

    /* Fixed Bottom Tab Bar */
    .tab-bar {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 64px;
      background-color: #fdfbf7;
      border-top: 1.5px solid #F3F2E9;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 14px;
      box-sizing: border-box;
      z-index: 10;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--color-text-gray);
      transition: color 0.2s ease;
    }
    .tab-item svg {
      width: 20px;
      height: 20px;
      margin-bottom: 3px;
      fill: currentColor;
    }
    .tab-item.active {
      color: var(--color-primary-purple);
    }
    .tab-item p {
      font-family: var(--font-family-lato);
      font-weight: 900;
      font-size: 8px;
      text-transform: uppercase;
      margin: 0;
      letter-spacing: 0.5px;
    }
    .home-indicator {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 6px;
      width: 110px;
      height: 4px;
      background-color: #d3dae1;
      border-radius: 80px;
      z-index: 10;
    }
  </style>
</head>
